<!DOCTYPE html>
<html>
<head>
    <title>Virtual Try - Glasses</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <style>
        body {
            margin: 0;
            text-align: center;
            background: #111;
            color: white;
        }

        video, canvas {
            position: absolute;
            left: 0;
            top: 0;
        }

        #container {
            position: relative;
            width: 640px;
            height: 480px;
            margin: auto;
        }
    </style>
</head>
<body>

<h2>Virtual Try - Glasses</h2>

<div id="container">
    <video id="video" width="640" height="480" autoplay></video>
    <canvas id="canvas" width="640" height="480"></canvas>
</div>

<script>
const videoElement = document.getElementById('video');
const canvasElement = document.getElementById('canvas');
const canvasCtx = canvasElement.getContext('2d');

const faceMesh = new FaceMesh({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
});

faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults(results => {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

    if (results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // Nose bridge landmark
        const leftEye = landmarks[33];
        const rightEye = landmarks[263];

        const x = (leftEye.x + rightEye.x) / 2 * canvasElement.width;
        const y = (leftEye.y + rightEye.y) / 2 * canvasElement.height;

        const glasses = new Image();
        glasses.src = "/static/images/glasses.png";

        glasses.onload = function () {
            canvasCtx.drawImage(glasses, x - 120, y - 50, 240, 100);
        };
    }

    canvasCtx.restore();
});

const camera = new Camera(videoElement, {
    onFrame: async () => {
        await faceMesh.send({ image: videoElement });
    },
    width: 640,
    height: 480
});

camera.start();
</script>

</body>
</html>
