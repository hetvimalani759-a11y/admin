{% extends "app/base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'app/css/change_password.css' %}">

<div class="password-wrapper">
    <div class="password-card">

        <h2>🔐 Change Password</h2>
        <p class="subtitle">Keep your account secure</p>

        {% if error %}
            <div class="error-box" style="color: red;">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success-box" style="color: green;">{{ success }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <input type="password" name="current_password" placeholder="Current Password" required autofocus>
                <label>Current Password</label>
            </div>

            <div class="input-group">
                <input type="password" name="new_password" placeholder="New Password" required>
                <label>New Password</label>
            </div>

            <div class="input-group">
                <input type="password" name="confirm_password" placeholder="Confirm New Password" required>
                <label>Confirm New Password</label>
            </div>

            <button type="submit" class="btn-update">Update Password</button>
        </form>

    </div>
</div>
{% endblock %}
