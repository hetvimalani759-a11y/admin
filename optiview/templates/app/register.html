<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | Optiview</title>

<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(to right, #7ebaee, #ffffff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        width: 100%;
        max-width: 420px;
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin-bottom: 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: linear-gradient(to right, #634ffe, #3700fe);
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .error {
        background: #ffe6e6;
        color: #d8000c;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 12px;
        font-size: 14px;
    }

    a {
        display: block;
        margin-top: 15px;
        color: #4facfe;
        font-weight: bold;
        text-decoration: none;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Register</h2>

    {% for message in messages %}
        <div class="error">{{ message }}</div>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <!-- User fields -->
        <input type="text" name="username" placeholder="Username" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <input type="password" name="password2" placeholder="Confirm Password" required>

        <!-- UserProfile fields -->
        <input type="text" name="phone" placeholder="Phone (10 digits)" maxlength="10">
        <input type="date" name="dob" placeholder="Date of Birth">
        <select name="gender">
            <option value="">Select Gender</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
        </select>
        <textarea name="address" placeholder="Address" rows="3"></textarea>
       
        <button type="submit">Register</button>
    </form>

    <a href="{% url 'app:login' %}">Already have an account? Login</a>
</div>
</body>
</html>
