{% extends 'app/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'app/css/complaint.css' %}">
{% endblock %}

{% block content %}

<div class="complaint-page">

<div class="complaint-card">

<h2 class="complaint-title"> Report Issue</h2>

<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Reason</label>
<input type="text" name="reason" required>
</div>

<div class="form-group">
<label>Description</label>
<textarea name="description" rows="5" required></textarea>
</div>

<button class="submit-btn">
Submit Complaint
</button>

</form>

</div>

</div>

{% endblock %}
