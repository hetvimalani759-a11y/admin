{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'app/css/forgot_password.css' %}">
<style>
   /* forgot_password.css */

.forgot-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f0f2f5;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.forgot-card {
    background: #fff;
    padding: 40px 30px 30px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    width: 400px;
    position: relative;
    text-align: center;
}

.forgot-card h2 {
    margin-bottom: 10px;
    font-size: 26px;
    color: #333;
}

.forgot-card .subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

/* Error & Success boxes */
.error-box, .success-box {
    padding: 10px 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 14px;
}

.error-box {
    background: #ffe6e6;
    color: #cc0000;
    border: 1px solid #cc0000;
}

.success-box {
    background: #e6ffea;
    color: #008000;
    border: 1px solid #008000;
}

/* Form inputs */
.forgot-card .form-group {
    text-align: left;
    margin-bottom: 20px;
}

.forgot-card label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: #444;
}

.forgot-card input[type="email"],
.forgot-card input[type="password"],
.forgot-card input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

.forgot-card input[type="email"]:focus,
.forgot-card input[type="password"]:focus,
.forgot-card input[type="text"]:focus {
    border-color: #007bff;
    box-shadow: 0 0 5px rgba(0,123,255,0.3);
}

/* Button */
.reset-btn {
    width: 100%;
    padding: 12px;
    background: #007bff;
    color: #fff;
    font-size: 16px;
    font-weight: 500;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.reset-btn:hover {
    background: #0056b3;
}

/* Back to login */
.back-login {
    margin-top: 20px;
    font-size: 14px;
}

.back-login a {
    color: #007bff;
    text-decoration: none;
    transition: 0.3s;
}

.back-login a:hover {
    text-decoration: underline;
}

/* Image at the top */
.forgot-card::before {
    content: "";
    display: block;
    width: 80px;
    height: 80px;
    background-image: url('../images/forgot_password.png'); /* replace with your image path */
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    margin: 0 auto 20px auto;
}
</style>
<div class="forgot-wrapper">
    <div class="forgot-card">

        <h2>Reset Password</h2>
        <p class="subtitle">
            Enter your registered email address to receive an OTP for password reset.
        </p>

        {% if messages %}
    {% for message in messages %}
        <div class="{% if message.tags == 'error' %}error-box{% else %}success-box{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required>
            </div>

            <button type="submit" class="reset-btn">Send OTP</button>
        </form>

        <div class="back-login">
            <a href="{% url 'delivery:delivery_login' %}">← Back to Login</a>
        </div>

    </div>
</div>
{% endblock %}
