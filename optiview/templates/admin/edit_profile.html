{% extends 'admin/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin/css/mix.css' %}">
{% endblock %}

{% block content %}

<div class="profile-page">

    <div class="profile-card">

        <h4 class="profile-heading">Edit Admin Profile</h4>

        <!-- enctype important for image upload -->
        <form method="POST" enctype="multipart/form-data" class="profile-form">
            {% csrf_token %}

            <!-- Profile Image -->
            <div class="form-group">
                <label>Profile Image</label>

                {% if profile.profile_image %}
                    <img src="{{ profile.profile_image.url }}" width="80" style="border-radius:50%; margin-bottom:10px;">
                {% endif %}

                <input type="file" name="profile_image">
            </div>

            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ request.user.first_name }}">
            </div>

            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ request.user.last_name }}">
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ request.user.username }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ request.user.email }}">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ profile.phone }}">
            </div>

            <div class="form-group">
                <label>Date of Birth</label>

                <!-- Future date block -->
                <input type="date" name="dob"
                       value="{{ profile.date_of_birth|date:'Y-m-d' }}"
                       max="{{ today }}">
            </div>

            <div class="form-group full-width">
                <label>Address</label>
                <textarea name="address">{{ profile.address }}</textarea>
            </div>

            <div class="profile-actions">

                <button type="submit" class="btn-save">
                    Update Profile
                </button>

                <a href="{% url 'adminpanel:admin_profile' %}" class="btn-cancel">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
