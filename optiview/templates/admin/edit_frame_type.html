{% extends "admin/base.html" %}

{% block extra_css %}
<style>
.edit-frame-container {
    padding: 30px;
    display: flex;
    justify-content: center;
}

.edit-frame-card {
    width: 100%;
    max-width: 500px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 30px;
    box-shadow: var(--card-shadow);
}

.edit-frame-card h2 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 20px;
    color: var(--text-main);
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--text-muted);
}

.form-group input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
}

.form-group input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(99,102,241,.15);
}

.btn-save {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-weight: 500;
    cursor: pointer;
}

.btn-save:hover {
    opacity: .9;
}
</style>
{% endblock %}

{% block content %}
<div class="edit-frame-container">
    <div class="edit-frame-card">
        <h2>Edit Frame Type</h2>

        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Frame Type Name</label>
                <input type="text" name="name" value="{{ frame_type.name }}" required>
            </div>

            <button type="submit" class="btn-save">
                Update Frame Type
            </button>
        </form>
    </div>
</div>
{% endblock %}
