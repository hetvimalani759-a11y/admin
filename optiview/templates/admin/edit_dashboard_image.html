{% extends "admin/base.html" %}
{% load static %}

{% block extra_css %}
<style>

/* SAME CATEGORY STYLE */
.dashboard-page {
  padding: 24px;
}

.dashboard-form-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--card-shadow);
}

.dashboard-page h4.dashboard-heading {
  color: var(--text-main);
  font-size: 18px;
  font-weight: 600;
}

/* Form */
.dashboard-form .form-group {
  margin-bottom: 14px;
}

.dashboard-form label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.dashboard-form input,
.dashboard-form textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: var(--bg-main);
  color: var(--text-main);
  font-size: 14px;
}

.dashboard-form input:focus,
.dashboard-form textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(99, 102, 241, .15);
}

/* Image preview */
.preview-img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid var(--card-border);
  margin-top: 5px;
}

/* Button */
.btn-primary {
  margin-top: 8px;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: var(--primary);
  color: white;
  font-weight: 500;
  cursor: pointer;
}

.btn-primary:hover {
  opacity: .9;
}

</style>
{% endblock %}


{% block content %}
<div class="dashboard-page">

  <div class="dashboard-form-card">
    <h4 class="dashboard-heading">Edit Dashboard Image</h4>

    <form method="POST" enctype="multipart/form-data" class="dashboard-form">
      {% csrf_token %}

      <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{ image.title }}">
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description">{{ image.description }}</textarea>
      </div>

      <div class="form-group">
        <label>Current Image</label><br>
        <img src="{{ image.image.url }}" class="preview-img">
      </div>

      <div class="form-group">
        <label>Change Image</label>
        <input type="file" name="image">
      </div>

      <button type="submit" class="btn-primary">Update</button>
       <a href="{% url 'adminpanel:add_dashboard_image' %}" class="btn-cancel w-100 mt-2">Cancel</a>
    </form>
  </div>

</div>
{% endblock %}
