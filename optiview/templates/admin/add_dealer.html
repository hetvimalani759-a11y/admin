{% extends "admin/base.html" %}
{% load static %}

{% block extra_css %}
<style>
/* ===== PAGE ===== */
.add-dealer-page {
    padding: 24px;
}

/* ===== CARD ===== */
.add-dealer-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 25px;
    box-shadow: var(--card-shadow);
    max-width: 600px;
    margin: auto;
}

/* ===== HEADINGS ===== */
.add-dealer-card h2 {
    color: var(--text-main);
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 20px;
}

/* ===== FORM FIELDS ===== */
.form-label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: var(--text-main);
}

input.form-control,
textarea.form-control {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--bg-main);
    color: var(--text-main);
    font-size: 14px;
}

input.form-control:focus,
textarea.form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(99, 102, 241, .15);
}

/* ===== BUTTON ===== */
.btn-success {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #16a34a;
    color: white;
    font-weight: 500;
    cursor: pointer;
}

.btn-success:hover {
    opacity: 0.9;
}
</style>
{% endblock %}

{% block content %}
<div class="add-dealer-page">
    <div class="add-dealer-card">
        <h2>Add Dealer</h2>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Save Dealer</button>
        </form>
    </div>
</div>
{% endblock %}
