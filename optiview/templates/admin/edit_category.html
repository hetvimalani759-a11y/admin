{% extends "admin/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin/css/edit_category.css' %}">
{% endblock %}

{% block content %}
<div class="categories-page">
  <div class="row g-4 justify-content-center">

    <!-- Edit Category Card -->
    <div class="col-md-6">
      <div class="category-form-card">
        <h4 class="category-heading ripple-text">✏️ Edit Category</h4>

        <form method="post" enctype="multipart/form-data" id="editCategoryForm" class="category-form">
  {% csrf_token %}
  
  <div class="form-group">
    <label>Category Name</label>
    <input type="text" name="name" value="{{ category.name }}" required>
  </div>
  
  <div class="form-group">
    <label>Image</label>
    <div class="img-preview">
      {% if category.image %}
        <img src="{{ category.image.url }}" alt="{{ category.name }}" class="preview-img">
      {% else %}
        <span class="no-img">No image</span>
      {% endif %}
    </div>
    <!-- Add file input for uploading a new image -->
    <input type="file" name="image">
  </div>

  <div class="form-actions">
    <button type="submit" class="btn-primary w-100">Update</button>
    <a href="{% url 'adminpanel:add_category' %}" class="btn-cancel w-100 mt-2">Cancel</a>
  </div>
</form>

      </div>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'admin/js/edit_category.js' %}"></script>
{% endblock %}
