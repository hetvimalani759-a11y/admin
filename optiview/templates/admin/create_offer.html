{% extends "admin/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin/css/create_offer.css' %}">
<!-- Flatpickr CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{% endblock %}

{% block content %}
<div class="create-offer-page">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="category-form-card">
        <h4 class="category-heading ripple-text">🎁 Create Offer</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="category-form">
          {% csrf_token %}

          <div class="form-group">
            <label>Offer Name</label>
            <input type="text" name="name" required>
          </div>

          <div class="form-group">
            <label>Discount Type</label>
            <select name="discount_type" required>
                <option value="percent">Percentage (%)</option>
                <option value="flat">Flat Amount (₹)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Discount Value</label>
            <input type="number" step="0.01" name="discount_value" required>
          </div>

          <div class="form-group">
            <label>Apply To Product</label>
            <select name="product" id="productSelect">
                <option value="">-- Select Product --</option>
                {% for p in products %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
          </div>

          <div class="or-text">OR</div>

          <div class="form-group">
            <label>Apply To Category</label>
            <select name="category" id="categorySelect">
                <option value="">-- Select Category --</option>
                {% for c in categories %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label>Start Date</label>
            <input type="text" id="start_date" name="start_date" required>
          </div>

          <div class="form-group">
            <label>End Date</label>
            <input type="text" id="end_date" name="end_date" required>
          </div>

          <div class="form-group checkbox">
            <label>
              <input type="checkbox" name="is_active" checked> Active
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary w-100">Create Offer</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'admin/js/create_offer.js' %}"></script>
<!-- Flatpickr JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
  // Initialize flatpickr for Start Date
  // Initialize End Date first
const endPicker = flatpickr("#end_date", {
    dateFormat: "Y-m-d",
    allowInput: false,  // prevent typing
});

// Initialize Start Date
const startPicker = flatpickr("#start_date", {
    dateFormat: "Y-m-d",
    minDate: "today",
    onChange: function(selectedDates) {
        if (selectedDates.length > 0) {
            const startDate = selectedDates[0];

            // Set End Date minDate to Start Date + 1 day
            const nextDay = new Date(startDate);
            nextDay.setDate(nextDay.getDate() + 1);

            endPicker.set('minDate', nextDay);

            // Optional: if End Date is now before new minDate, update it
            const endDateVal = endPicker.selectedDates[0];
            if (!endDateVal || endDateVal <= startDate) {
                endPicker.clear(); // force user to pick new valid End Date
            }
        }
    }
});

</script>


 
{% endblock %}
