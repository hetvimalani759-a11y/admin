{% extends "admin/base.html" %}
{% load static %}

{% block extra_css %}
<style>
/* ===== PAGE ===== */
.dealers-page {
    padding: 24px;
    display: flex;
    justify-content: center;
}

/* ===== CARD ===== */
.dealers-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 30px;
    width: 100%;
    max-width: 700px;
    box-shadow: var(--card-shadow);
}

/* ===== HEADINGS ===== */
.dealers-card h2 {
    margin-bottom: 20px;
}

/* ===== FORM GROUPS ===== */
.dealers-card .form-group {
    margin-bottom: 15px;
}

.dealers-card label {
    font-weight: 500;
    display: block;
    margin-bottom: 5px;
}

.dealers-card input,
.dealers-card textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--input-bg);
    font-size: 14px;
}

/* ===== BUTTONS ===== */
.dealers-card .btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
}

.dealers-card .btn + .btn {
    margin-left: 10px;
}

/* ===== ALERTS ===== */
.alert {
    padding: 10px 15px;
    border-radius: 8px;
    margin-bottom: 15px;
}
.alert-success {
    background: #d4edda;
    color: #155724;
}
.alert-error,
.alert-danger {
    background: #f8d7da;
    color: #721c24;
}
/* ===== INPUTS & TEXTAREAS ===== */
.dealers-card input,
.dealers-card textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    background: var(--input-bg); /* your dark/light input bg */
    color: var(--text-color);    /* ensures text is visible in dark mode */
    font-size: 14px;
}

/* optional: placeholder color */
.dealers-card input::placeholder,
.dealers-card textarea::placeholder {
    color: var(--text-color-muted); /* lighter for placeholder */
}
</style>
{% endblock %}

{% block content %}
<div class="dealers-page">
    <div class="dealers-card">

        <h2>Edit Dealer</h2>

        <!-- Django messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" value="{{ dealer.name }}" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" value="{{ dealer.email }}">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone" value="{{ dealer.phone }}">
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea name="address" id="address" rows="3">{{ dealer.address }}</textarea>
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Update Dealer</button>
                <a href="{% url 'adminpanel:dealer_list' %}" class="btn btn-secondary">Cancel</a>
            </div>

        </form>
    </div>
</div>
{% endblock %}
