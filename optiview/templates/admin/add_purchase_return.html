{% extends 'admin/base.html' %}
{% load static %}

{% block extra_css %}
<style>
.purchase-return-form-page {
    padding: 24px;
}

/* Form Card */
.return-form-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 22px;
    max-width: 480px;
    margin: auto;
    box-shadow: var(--card-shadow);
}

/* Headings */
.return-form-card h2 {
    color: var(--text-main);
    margin-bottom: 18px;
}

/* Form */
.form-group {
    margin-bottom: 16px;
}

label {
    display: block;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--text-muted);
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--bg-main);
    color: var(--text-main);
    font-size: 14px;
}

input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.15);
}

/* Button */
.btn-submit {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background-color: var(--primary);
    color: white;
    font-weight: 500;
    cursor: pointer;
}

.btn-submit:hover {
    opacity: 0.9;
}

/* Messages */
.message {
    margin-bottom: 14px;
    padding: 10px;
    border-radius: 6px;
}

.message.error {
    background: #fee2e2;
    color: #dc2626;
}

.message.success {
    background: #eef4ff;
    color: #2563eb;
}
</style>
{% endblock %}

{% block content %}
<div class="purchase-return-form-page">
    <div class="return-form-card">
        <h2>📤 Add Purchase Return</h2>

        {% if messages %}
          {% for message in messages %}
            <div class="message {% if message.tags == 'error' %}error{% else %}success{% endif %}">
                {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Select Purchase Item</label>
                <select name="purchase_item" required>
                    <option value="">-- Select Item --</option>
                    {% for item in purchase_items %}
                        <option value="{{ item.id }}">
                            {{ item.purchase.bill_number }} | {{ item.variant.product.name }} - {{ item.variant.color.name }} | Stock: {{ item.variant.stock }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Return Quantity</label>
                <input type="number" name="quantity" min="1" required>
            </div>

            <div class="form-group">
                <label>Reason (optional)</label>
                <textarea name="reason" rows="3"></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit Return</button>
        </form>
    </div>
</div>
{% endblock %}
