{% extends "admin/base.html" %}
{% block extra_css %}

<style>

.lens-page {
  padding: 24px;
  display: flex;
  justify-content: center;   /* horizontal center */
  align-items: center;       /* vertical center */
  min-height: calc(100vh - 120px); /* full height minus header */
}
.lens-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 22px;
  width: 100%;
  max-width: 500px;
  box-shadow: var(--card-shadow);
}

.page-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--text-main);
  margin-bottom: 18px;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--card-border);
  background: var(--bg-main);
  color: var(--text-main);
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(99,102,241,.15);
}

.btn-save {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: var(--primary);
  color: white;
  font-weight: 500;
  cursor: pointer;
}

.btn-save:hover {
  opacity: .9;
}

</style>

{% endblock %}

{% block content %}

<div class="lens-page">

<div class="lens-card">

<h2 class="page-title">➕ Add Lens</h2>

<form method="POST">
{% csrf_token %}

<div class="form-group">
<label>Lens Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Description</label>
<textarea name="description"></textarea>
</div>

<div class="form-group">
<label>Additional Price</label>
<input type="number" step="0.01" name="price">
</div>
<div class="form-group">
<label>
<input type="checkbox" name="power_required" checked>
 Power Required
</label>
</div>
<div class="form-group">
<label>
<input type="checkbox" name="is_active" checked>
 Active
</label>
</div>

<button type="submit" class="btn-save">
Save Lens
</button>

</form>

</div>

</div>

{% endblock %}
